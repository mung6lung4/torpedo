services:
  torpedo-app:
    image: mung6lung4/torpedo:latest
    container_name: torpedo-latest
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
    user: "0:0"
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data:rw
      - ./logs:/app/logs:rw
      - ./backups:/app/backups:rw
      - ./static/uploads:/app/static/uploads:rw
      - ./static/uploads:/app/static-dist/uploads:rw
      - /etc/localtime:/etc/localtime:ro
    environment:
      - STATIC_DIR=/app/static-dist
      # CDKEY 加密主密钥（Fernet）
      - ACTIVATION_MASTER_KEY=example
    networks:
      - torpedo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  torpedo-network:
    driver: bridge
